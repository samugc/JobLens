[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joblens-public"
version = "1.0.0"
description = "Local evidence-grounded CV tailoring with human confirmation and PDF/DOCX export"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Samuel García" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pypdf>=5.0,<7", "reportlab>=4.0", "python-docx>=1.0"]

[project.optional-dependencies]
# certifi is a transitive dependency of pip-audit/requests. Keep the floor at
# the first patched release so hosted macOS images upgrade their preinstalled
# copy instead of leaving an audited vulnerability in the dev environment.
dev = ["pytest>=8.0", "ruff>=0.7", "pip-audit>=2.7", "certifi>=2026.10.19"]

[project.scripts]
joblens-public = "joblens_public.cli:main"
joblens-cv-server = "joblens_public.cv_parser.http_transport:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# The integration scratch directory holds verification scripts and logs, not
# product code. It is not linted and it is not committed.
extend-exclude = [".integration-verification"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
