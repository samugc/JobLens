name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools build
          python -m pip install -e '.[dev]'

      - name: Lint Python
        run: python -m ruff check .

      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Run UI tests
        run: node --test tests/ui/*.test.mjs

      - name: Run synthetic release evaluation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m evaluation.run_evaluation --output evaluation/results.json

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Build source archive and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m build --sdist --wheel --outdir dist

      - name: Inspect release archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python scripts/inspect_release_archive.py dist
